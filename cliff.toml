[bump]
initial_tag = "v0.1.0"

[changelog]
render_always = false
header = ""
body = """
{% if version %}
    ## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
    ## Unreleased
{% endif %}
{% if version and previous.version %}
    Full Changelog: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif -%}
        {% if commit.breaking %}**Breaking change:** {% endif -%}
        {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {%- endfor %}
{% endfor %}
"""
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 00 -->Features" },
    { message = "^fix", group = "<!-- 01 -->Bug fixes" },
    { message = "^style", group = "<!-- 02 -->Styling" },
    { message = ".*", group = "<!-- 99 -->Miscellaneous changes" },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
