# yaml-language-server: $schema=https://storage.googleapis.com/nais-json-schema-2c91/nais/nais.io_v1alpha1_Application.json
# Consumer example: copy into your own repository as .nais/app.yaml.
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nais-github-teamsync
  # Set these to your team, or let your own deployment workflow override them.
  namespace: your-team
  labels:
    team: your-team
  annotations:
    nais.io/run-as-user: "65532"
    nais.io/run-as-group: "65532"
spec:
  # Supply spec.image with nais apply --set; no mutable image tag is baked in.
  port: 3105
  service:
    port: 80
    protocol: http
  replicas:
    min: 1
    max: 1
    disableAutoScaling: true
  strategy:
    type: Recreate
  terminationGracePeriodSeconds: 30
  startup:
    path: /healthz
    port: 3105
    periodSeconds: 2
    failureThreshold: 60
    timeout: 1
  liveness:
    path: /healthz
    port: 3105
    periodSeconds: 10
    timeout: 1
  readiness:
    path: /healthz
    port: 3105
    periodSeconds: 5
    timeout: 1
  prometheus:
    enabled: true
    path: /metrics
    port: "3105"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  env:
    - name: LISTEN_ADDRESS
      value: "0.0.0.0:3105"
    - name: LOG_FORMAT
      value: json
  # GitHub credentials, NAIS_API_URL, webhook configuration, and optional tuning
  # are supplied by this user-defined Nais Secret. Nais injects the workload
  # identity token and NAIS_SERVICE_ACCOUNT_TOKEN_PATH automatically; bind this
  # workload to a Nais API service account in Console. Do not add a static Nais
  # API token or override the injected path in this Secret or manifest.
  envFrom:
    - secret: nais-github-teamsync
  accessPolicy:
    inbound:
      rules: []
    outbound:
      external:
        - host: api.github.com
