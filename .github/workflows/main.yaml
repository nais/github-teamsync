name: Check, build and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-info.outputs.tag }}
      version: ${{ steps.release-info.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
      - id: release-info
        run: mise run ci:release-info

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mise-task:
          - test
          - check:deadcode
          - check:golangci-lint
          - check:gosec
          - check:ratchet
          - check:staticcheck
          - check:govulncheck
          - check:govet
          - check:tidy
          - fmt:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
      - run: mise run ${{ matrix.mise-task }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
      - run: mise run build
      - name: Build container
        run: docker build --build-arg GO_VERSION="$(mise current go)" --tag nais-github-teamsync:check .

  # Stable required check for branch protection, including failed or skipped jobs.
  branch-protection-checkpoint:
    runs-on: ubuntu-latest
    needs: [check, build, release-info]
    if: ${{ always() }}
    steps:
      - if: ${{ needs.check.result != 'success' || needs.build.result != 'success' || needs.release-info.result != 'success' }}
        run: exit 1
      - run: echo "All checks and builds passed."

  publish:
    runs-on: ubuntu-latest
    needs: [branch-protection-checkpoint, release-info]
    if: needs.release-info.outputs.version != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Check image-publishing configuration
        env:
          NAIS_TEAM: ${{ vars.NAIS_TEAM }}
        run: |
          set -euo pipefail
          test -n "$NAIS_TEAM" || { echo 'Set the NAIS_TEAM repository variable before publishing.' >&2; exit 1; }
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
      - name: Resolve Go version from mise
        id: toolchain
        run: echo "go-version=$(mise current go)" >> "$GITHUB_OUTPUT"
      - name: Select distribution image version
        id: release
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release version is not a valid container tag.' >&2; exit 1; }
          echo "image=ghcr.io/${REPOSITORY,,}:${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build and publish signed image and SBOM to the Nais registry
        uses: nais/docker-build-push@ceabe305c64640175f133b7e59af6666b0a3c46c # ratchet:nais/docker-build-push@v0
        id: image
        with:
          team: ${{ vars.NAIS_TEAM }}
          tenant: ${{ vars.NAIS_TENANT || 'nav' }}
          build_args: |
            GO_VERSION=${{ steps.toolchain.outputs.go-version }}
            VERSION=${{ needs.release-info.outputs.version }}
      - name: Publish the reusable image to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SOURCE_IMAGE: ${{ steps.image.outputs.image }}
          TARGET_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_IMAGE" || { echo 'The image-building step did not produce an image.' >&2; exit 1; }
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx imagetools create --tag "$TARGET_IMAGE" "$SOURCE_IMAGE"
          echo "Published image: \`$TARGET_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  release-github:
    runs-on: ubuntu-latest
    needs: [release-info, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # ratchet:jdx/mise-action@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          IMAGE: ${{ needs.publish.outputs.image }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args=(--current)
          else
            args=(--tag "$RELEASE_TAG" --unreleased)
          fi
          git-cliff --offline --github-repo "$GITHUB_REPOSITORY" "${args[@]}" --strip all > release-notes.md
          printf '\nContainer image: `%s`\n' "$IMAGE" >> release-notes.md
          gh release create "$RELEASE_TAG" --target "$COMMIT_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md
